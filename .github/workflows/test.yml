name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Three Rust jobs, split by which system libraries their crates need rather than one crate each:
# `rust-core` needs FFmpeg's libraries for media encoding, `rust-apps` needs gpui's (xkbcommon, FreeType, Wayland) plus FFmpeg
# for the pack editor's previews, `rust-engine` needs FFmpeg, ALSA and X11. Between them they
# cover every crate in the workspace except the `spikes/`.
#
# Every job that compiles `shared`'s tests, `lewdware` or `lewdware-config` has to build the
# default modes first: all three `include_bytes!` the built `.lwmode` bundles, so without them the
# crate does not compile at all. Actions has no YAML anchors, hence the repeated step.

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # shared, lw, converter. `converter` turns on `shared`'s `encode` feature, which links FFmpeg's
  # libraries (the system's here; release builds vendor an LGPL one, which doesn't yet build in the
  # SVT-AV1, Opus and libwebp encoders encoding needs).
  rust-core:
    name: Core Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # The `ffmpeg` program only builds the integration tests' corpus; the code under test uses
      # the libraries. avifenc encodes images.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            ffmpeg \
            libavif-bin

      - name: Build the default modes
        run: |
          for mode in sandbox experience; do
            (cd "default-modes/$mode" && cargo run -p lw -- mode build)
          done

      - name: Run tests
        run: cargo test -p shared -p lw -p converter

      # The media-classification unit tests are hermetic (frozen probe JSON) and ran above. These
      # `#[ignore]`d ones are the counterpart: they probe and encode a real corpus through the
      # linked libraries, whose decoder coverage shifts between FFmpeg releases -- animated WebP
      # became decodable mid-2026 and silently changed how those files classify. Running them here
      # means that drift fails in CI instead of in a user's pack.
      - name: Record FFmpeg version
        run: ffmpeg -version | head -1

      - name: Run probe and encode tests against the real libraries
        run: cargo test -p shared --features encode --lib integration -- --ignored --nocapture

      - name: Clippy
        run: cargo clippy -p shared -p lw -p converter --all-targets --features shared/encode -- -D warnings

  # The two gpui apps and their crates, plus the supervisor. gpui links xkbcommon(-x11) and
  # FreeType; the pack editor's previews link FFmpeg (the system's here; release builds vendor an
  # LGPL one), dav1d and ALSA; the supervisor's global panic-key hook needs X11
  # (rdev -> libX11/XTest/XInput).
  rust-apps:
    name: App Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libasound2-dev \
            libdbus-1-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            libdav1d-dev

      - name: Build the default modes
        run: |
          for mode in sandbox experience; do
            (cd "default-modes/$mode" && cargo run -p lw -- mode build)
          done

      - name: Run tests
        run: cargo test -p lewdware-config -p lewdware-pack-editor -p pack-editor-core -p shared-gpui -p media-gpui -p lewdware-supervisor

      - name: Clippy
        run: cargo clippy -p lewdware-config -p lewdware-pack-editor -p pack-editor-core -p shared-gpui -p media-gpui -p lewdware-supervisor --all-targets -- -D warnings

  rust-engine:
    name: Engine Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # ffmpeg-next links the system libav* here (release builds link a static, LGPL-only build
      # instead: deploy/build_ffmpeg.sh). dav1d is the AVIF decoder behind `image`, alsa is cpal's
      # Linux backend, and X11 is winit's. The ffmpeg program makes the clips for the `sidecar`
      # decode tests below.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxrandr-dev \
            libxcursor-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            libdav1d-dev \
            ffmpeg

      - name: Build the default modes
        run: |
          for mode in sandbox experience; do
            (cd "default-modes/$mode" && cargo run -p lw -- mode build)
          done

      - name: Run tests
        run: cargo test -p lewdware

      # `video.rs`'s pacing tests are hermetic (hand-fed frame channel, no ffmpeg) and run above.
      # Its `sidecar` tests are the decode-level counterpart: they need a real clip with real
      # B-frames, because the thing they pin -- that the decoder is drained rather than flushed at
      # the end of each pass, so the frames it holds back are shown instead of discarded -- cannot
      # be reproduced without a decoder that actually holds frames back. The clips are made with
      # the `ffmpeg` program installed above.
      - name: Run decode tests against real clips
        run: cargo test -p lewdware --bin lewdware-engine sidecar -- --ignored --nocapture

      - name: Clippy
        run: cargo clippy -p lewdware --all-targets -- -D warnings

  lua:
    name: Lua syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lua 5.4
        run: sudo apt-get install -y lua5.4

      - name: Check syntax
        run: find default-modes/sandbox/src default-modes/experience/src default-modes/shared/lib -name '*.lua' -exec luac5.4 -p {} +
