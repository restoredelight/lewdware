name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Three Rust jobs, split by which system libraries their crates need rather than one crate each:
# `rust-core` needs nothing, `rust-apps` needs the Tauri/GTK stack, `rust-engine` needs FFmpeg,
# ALSA and X11. Between them they cover every crate in the workspace.
#
# Every job that compiles `shared`'s tests, `lewdware` or `lewdware-config` has to build the
# default modes first: all three `include_bytes!` the built `.lwmode` bundles, so without them the
# crate does not compile at all. Actions has no YAML anchors, hence the repeated step.

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # shared, lw, converter -- pure Rust, no system dependencies.
  rust-core:
    name: Core Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the default modes
        run: |
          for mode in sandbox experience; do
            (cd "default-modes/$mode" && cargo run -p lw -- mode build)
          done

      - name: Run tests
        run: cargo test -p shared -p lw -p converter

      # The media-classification unit tests are hermetic (frozen ffprobe JSON, no binaries) and ran
      # above. These `#[ignore]`d ones are the counterpart: the sidecars are built from FFmpeg
      # *master*, so ffprobe's actual output shifts under us between releases -- animated WebP
      # became decodable mid-2026 and silently changed how those files classify. Running them here
      # means that drift fails in CI instead of in a user's pack.
      #
      # They share this job rather than standing alone: the download is its own step, so a fetch
      # outage still fails under its own name, and a separate job would rebuild all of `shared`
      # -- default modes included -- to run a handful of tests.
      #
      # The script stages lewdware-ffmpeg/lewdware-ffprobe under pack-editor/src-tauri/binaries,
      # which is where the tests look by default. It must run from the repo root.
      - name: Download FFmpeg sidecars
        run: ./deploy/linux/download_ffmpeg_sidecars.sh

      - name: Record sidecar version
        run: ./pack-editor/src-tauri/binaries/lewdware-ffprobe -version | head -1

      - name: Run classification tests against the real sidecar
        run: cargo test -p shared --lib sidecar -- --ignored --nocapture

      - name: Clippy
        run: cargo clippy -p shared -p lw -p converter --all-targets -- -D warnings

  # The two Tauri apps plus the supervisor: GTK/WebKit for the apps, X11 for the supervisor's
  # global panic-key hook (rdev -> libX11/XTest/XInput).
  rust-apps:
    name: App Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev

      # `bundle.resources` in the pack editor's tauri.conf.json globs `binaries/lewdware-*`, and
      # tauri-build fails at compile time when a resource glob matches nothing. Nothing here ever
      # runs them -- the tests that need real sidecars live in `rust-core` -- so empty files do.
      - name: Create sidecar placeholders
        run: |
          mkdir -p pack-editor/src-tauri/binaries
          touch pack-editor/src-tauri/binaries/lewdware-{ffmpeg,ffprobe,avifenc}

      - name: Build the default modes
        run: |
          for mode in sandbox experience; do
            (cd "default-modes/$mode" && cargo run -p lw -- mode build)
          done

      - name: Run tests
        run: cargo test -p lewdware-pack-editor -p lewdware-config -p lewdware-supervisor

      - name: Clippy
        run: cargo clippy -p lewdware-pack-editor -p lewdware-config -p lewdware-supervisor --all-targets -- -D warnings

  rust-engine:
    name: Engine Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # ffmpeg-next links the system libav* here (release builds vendor them instead, via the
      # `build-ffmpeg` feature). dav1d is the AVIF decoder behind `image`, alsa is cpal's Linux
      # backend, and X11 is winit's. No GTK/WebKit: the engine is winit + wgpu, not Tauri.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxrandr-dev \
            libxcursor-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            libdav1d-dev

      - name: Build the default modes
        run: |
          for mode in sandbox experience; do
            (cd "default-modes/$mode" && cargo run -p lw -- mode build)
          done

      - name: Run tests
        run: cargo test -p lewdware

      # `video.rs`'s pacing tests are hermetic (hand-fed frame channel, no ffmpeg) and run above.
      # Its `sidecar` tests are the decode-level counterpart: they need a real clip with real
      # B-frames, because the thing they pin -- that the decoder is drained rather than flushed at
      # the end of each pass, so the frames it holds back are shown instead of discarded -- cannot
      # be reproduced without a decoder that actually holds frames back.
      - name: Download FFmpeg sidecars
        run: ./deploy/linux/download_ffmpeg_sidecars.sh

      - name: Run decode tests against the real sidecar
        run: cargo test -p lewdware --bin lewdware-engine sidecar -- --ignored --nocapture

      - name: Clippy
        run: cargo clippy -p lewdware --all-targets -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: |
            config/pnpm-lock.yaml
            pack-editor/pnpm-lock.yaml

      - name: Install dependencies (config)
        run: pnpm install
        working-directory: config

      - name: Type check (config)
        run: pnpm check
        working-directory: config

      - name: Install dependencies (pack-editor)
        run: pnpm install
        working-directory: pack-editor

      - name: Type check (pack-editor)
        run: pnpm check
        working-directory: pack-editor

      - name: Unit tests (pack-editor)
        run: pnpm test
        working-directory: pack-editor

  lua:
    name: Lua syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lua 5.4
        run: sudo apt-get install -y lua5.4

      - name: Check syntax
        run: find default-modes/sandbox/src default-modes/experience/src default-modes/shared/lib -name '*.lua' -exec luac5.4 -p {} +
