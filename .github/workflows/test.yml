name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Lua 5.4 headers
        run: sudo apt-get install -y liblua5.4-dev

      - name: Run tests
        run: cargo test -p shared -p lw

      - name: Clippy
        run: cargo clippy -p shared -p lw --all-targets -- -D warnings

  # The media-classification unit tests are hermetic (frozen ffprobe JSON, no binaries), so they
  # run in `rust` above. This job covers what those can't: the sidecars are built from FFmpeg
  # *master*, so ffprobe's actual output shifts under us between releases -- animated WebP became
  # decodable mid-2026 and silently changed how those files classify. These `#[ignore]`d tests
  # probe real generated media, so that drift fails here instead of in a user's pack.
  #
  # Split from `rust` on purpose: it pulls ~150MB from a third-party release, so keeping it in
  # its own job means a fetch outage points at itself instead of looking like a test failure.
  media-sidecar:
    name: Media classification (real ffprobe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Lua 5.4 headers
        run: sudo apt-get install -y liblua5.4-dev

      # Stages lewdware-ffmpeg/lewdware-ffprobe under pack-editor/src-tauri/binaries, which is
      # where the tests look by default. Must run from the repo root.
      - name: Download FFmpeg sidecars
        run: ./deploy/linux/download_ffmpeg_sidecars.sh

      - name: Record sidecar version
        run: ./pack-editor/src-tauri/binaries/lewdware-ffprobe -version | head -1

      - name: Run classification tests against the real sidecar
        run: cargo test -p shared --lib sidecar -- --ignored --nocapture

  rust-pack-editor:
    name: pack-editor Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            liblua5.4-dev

      - name: Create sidecar stubs
        run: |
          TRIPLE=$(rustc -vV | grep '^host:' | cut -d' ' -f2)
          mkdir -p pack-editor/src-tauri/binaries
          for name in lewdware-ffmpeg lewdware-ffprobe lewdware-avifenc; do
            stub="pack-editor/src-tauri/binaries/${name}-${TRIPLE}"
            printf '#!/bin/sh\n' > "$stub"
            chmod +x "$stub"
          done

      - name: Build default modes
        run: |
          cargo run -p lw -- mode build
        working-directory: default-modes/sandbox

      - name: Build Experience mode
        run: |
          cargo run -p lw -- mode build
        working-directory: default-modes/experience

      - name: Run tests
        run: cargo test -p lewdware-pack-editor

      - name: Clippy
        run: cargo clippy -p lewdware-pack-editor -p lewdware-config --all-targets -- -D warnings

  rust-engine:
    name: Engine Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            rpm \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxrandr-dev \
            libxcursor-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            libdav1d-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            patchelf \
            xdg-utils

      - name: Build default modes
        run: |
          cargo run -p lw -- mode build
        working-directory: default-modes/sandbox

      - name: Build Experience mode
        run: |
          cargo run -p lw -- mode build
        working-directory: default-modes/experience

      - name: Run tests
        run: cargo test -p lewdware

      # `video.rs`'s pacing tests are hermetic (hand-fed frame channel, no ffmpeg) and run above.
      # Its `sidecar` tests are the decode-level counterpart: they need a real clip with real
      # B-frames, because the thing they pin -- that the decoder is drained rather than flushed at
      # the end of each pass, so the frames it holds back are shown instead of discarded -- cannot
      # be reproduced without a decoder that actually holds frames back.
      #
      # Unlike `media-sidecar`, this shares a job with the tests above rather than standing alone:
      # building the engine pulls the whole ffmpeg/GTK/X11 dependency set installed above, so a
      # separate job would pay for all of it again to run two tests that take under a second. The
      # download is its own step, so a fetch outage still fails under its own name.
      - name: Download FFmpeg sidecars
        run: ./deploy/linux/download_ffmpeg_sidecars.sh

      - name: Run decode tests against the real sidecar
        run: cargo test -p lewdware --bin lewdware-engine sidecar -- --ignored --nocapture

      - name: Clippy
        run: cargo clippy -p lewdware --all-targets -- -D warnings

  frontend:
    name: Frontend type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies (config)
        run: pnpm install
        working-directory: config

      - name: Type check (config)
        run: pnpm check
        working-directory: config

      - name: Install dependencies (pack-editor)
        run: pnpm install
        working-directory: pack-editor

      - name: Type check (pack-editor)
        run: pnpm check
        working-directory: pack-editor

  lua:
    name: Lua syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get install -y lua5.4

      - name: Check syntax
        run: find default-modes/sandbox/src default-modes/experience/src default-modes/shared/lib -name '*.lua' -exec luac5.4 -p {} +
