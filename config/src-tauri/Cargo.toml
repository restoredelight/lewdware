[[bin]]
name = "lewdware"
path = "src/main.rs"

[package]
name = "lewdware-config"
version.workspace = true
description = "Lewdware Config App"
authors = ["restoredelight"]
edition = "2021"

[lib]
name = "lewdware_config_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../../shared", features = ["ipc", "autostart"] }
anyhow = "1"
base64 = "0.22"
dirs = "6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
rusqlite = { version = "0.40.1", features = ["bundled", "fallible_uint"] }
tempfile = "3"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
