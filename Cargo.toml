[workspace]
members = [
    "converter",
    "core",
    "launcher",
    "lewdware",
    "lw",
    "pack-editor-core",
    "pack-editor-gpui",
    "shared",
    "config-gpui",
    "shared-gpui",
    "media-gpui",
    "spikes/video-gpui",
    "supervisor"
]
resolver = "3"

[workspace.package]
version = "0.0.2"

[patch.crates-io]
pulseaudio = { git = "https://github.com/restoredelight/pulseaudio-rs.git", rev = "fafa8a05bfc36e38f4eda2be0db67c75dd8805ff" }

[profile.dev]
# Keep file/line backtraces without the large variable/type debug information.
debug = "line-tables-only"

# Image decoding unoptimised is 10-20x slower (a 1080p WebP took 2.2s to preview, against
# 170ms optimised), which made previews and thumbnails slow in debug builds.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package."image-webp"]
opt-level = 3

[profile.dev.package."zune-jpeg"]
opt-level = 3

[profile.dev.package."zune-core"]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package."simd-adler32"]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.fast_image_resize]
opt-level = 3

[profile.release]
# Drop the symbol table from release binaries (about 40 MB off the shared library). Exported
# symbols the launchers load stay: they live in the dynamic symbol table, which this keeps.
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
