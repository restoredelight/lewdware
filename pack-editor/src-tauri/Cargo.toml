[package]
name = "lewdware-pack-editor"
version.workspace = true
description = "Create and edit Lewdware packs"
authors = ["restoredelight <restoreddelight@proton.me>"]
edition = "2021"

[lib]
name = "lewdware_pack_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-prevent-default = { version = "5", features = ["platform-windows"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../../shared" }
converter = { path = "../../converter" }
pack-editor-core = { path = "../../pack-editor-core" }
anyhow = "1"
axum = "0.8"
dirs = "6"
rusqlite = { version = "0.40.1", features = ["array", "backup", "bundled", "fallible_uint", "session", "vtab"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v4"] }

# Holding off idle suspend during long imports and saves (see src/keep_awake.rs). Linux goes
# through the desktop portal instead, which keepawake does not use.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
keepawake = "0.6"
