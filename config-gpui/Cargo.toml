[package]
name = "config-gpui"
version.workspace = true
description = "Configure and launch Lewdware (gpui pilot)"
authors = ["restoredelight"]
edition = "2021"

[dependencies]
gpui-kit = "0.9.0"
shared = { path = "../shared", features = ["ipc"] }
shared-gpui = { path = "../shared-gpui" }
anyhow = "1"
auto-launch = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
indexmap = "2"
interprocess = { version = "2.4.2", features = ["tokio"] }
# async-std, not tokio: rfd's `tokio` feature switches zbus to its tokio backend for the whole
# binary, and gpui's own portal/accessibility code then panics on threads with no tokio runtime.
# The Tauri apps (config/, pack-editor/) still enable zbus/tokio through tauri-plugin-dialog, and
# Cargo unifies features across one build invocation -- so build this crate with
# `-p config-gpui`, not as part of a workspace-wide build, until they are retired.
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "wayland", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "process", "io-util"] }
tracing = "0.1"
r2d2 = "0.8"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
rusqlite = { version = "0.40.1", features = ["bundled", "fallible_uint"] }
tempfile = "3"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
