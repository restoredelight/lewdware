# The tray's "Open Lewdware" and `shared::binaries::find_config_binary` look for this binary name
# (and, in dev builds, `cargo run -p lewdware-config`).
[[bin]]
name = "lewdware"
path = "src/main.rs"

[package]
name = "lewdware-config"
version.workspace = true
description = "Configure and launch Lewdware"
authors = ["restoredelight"]
edition = "2021"

[dependencies]
gpui-kit = "0.9.0"
shared = { path = "../shared", features = ["ipc"] }
shared-gpui = { path = "../shared-gpui" }
anyhow = "1"
auto-launch = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
indexmap = "2"
interprocess = { version = "2.4.2", features = ["tokio"] }
# async-std, not tokio: rfd's `tokio` feature switches zbus to its tokio backend for the whole
# binary, and gpui's own portal/accessibility code then panics on threads with no tokio runtime.
# Nothing in the workspace may enable zbus/tokio (Cargo unifies features across one build).
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "wayland", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "process", "io-util"] }
tracing = "0.1"
r2d2 = "0.8"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
rusqlite = { version = "0.40.1", features = ["bundled", "fallible_uint"] }
tempfile = "3"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
