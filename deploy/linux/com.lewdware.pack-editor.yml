# Flatpak manifest for the Lewdware Pack Editor.
#
# The distro-independent Linux package, alongside the .deb, .rpm and tarball. It needs nothing
# from the host but a Flatpak install: the runtime carries xkbcommon, FreeType, dav1d and the ALSA
# plugin that routes sound to the PulseAudio socket, and the GL extension carries the host's
# Vulkan driver.
#
# Built from the .deb build_installer_b.sh produced, so this stays in step with what the other
# Linux packages ship rather than restating the file layout. The .deb's tree is relocatable (the
# editor finds its sidecars at `../lib/lewdware-pack-editor/binaries` from its executable), and its
# desktop file and icon are already named after this app id.
id: com.lewdware.pack-editor

# The plain freedesktop runtime: gpui draws with Vulkan and needs no toolkit. (The Tauri build used
# GNOME's for its WebKitGTK.)
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: lewdware-pack-editor

finish-args:
  # Windowing and GPU. `--device=dri` gives Vulkan the host's driver through the GL extension.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Deliberately no `LIBVA_DRIVERS_PATH` here. The runtime's libva is already built with a search
  # path that covers every place a driver can land: `.../dri` and its `intel-vaapi-driver` /
  # `nvidia-vaapi-driver` subdirectories, plus `.../GL/lib/dri`, which is where Flatpak aggregates
  # whichever GL extensions the host actually resolved. Setting the variable would *replace* that
  # path with a snapshot of one runtime's layout, so it would break on exactly the hosts it was
  # meant to help. The linked FFmpeg uses it for hardware encoding.
  #
  # No network: the editor makes no requests.
  #
  # Sound, for previewing a pack's audio and the audio track of its videos.
  - --socket=pulseaudio
  # Packs are the user's own files, opened and saved from wherever they keep them.
  - --filesystem=home

modules:
  - name: lewdware-pack-editor
    buildsystem: simple
    build-commands:
      - mkdir -p deb-extract
      - ar -x *.deb --output deb-extract
      # `tar -xf` detects the payload's compression itself, whichever dpkg-deb chose.
      - tar -C deb-extract -xf deb-extract/data.tar.*
      # The binary, the sidecars, the licences, the desktop file and the icons. `cp -a` keeps the
      # executable bits the sidecars need.
      - cp -a deb-extract/usr/. /app/
      - install -Dm644 com.lewdware.pack-editor.metainfo.xml /app/share/metainfo/com.lewdware.pack-editor.metainfo.xml
    sources:
      - type: file
        path: ../../dist/lewdware-pack-editor.deb
      - type: file
        path: com.lewdware.pack-editor.metainfo.xml
