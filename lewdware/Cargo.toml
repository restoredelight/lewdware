[[bin]]
name = "lewdware-engine"
path = "src/main.rs"

[package]
name = "lewdware"
version.workspace = true
edition = "2024"

[dependencies]
shared = { path = "../shared/", features = ["mlua", "ipc"] }
anyhow = "1.0.99"
egui = { version = "0.34.2", features = ["serde"] }
egui-wgpu = "0.34.2"
egui-winit = "0.34.2"
ffmpeg-next = "8.1.0"
image = { version = "0.25.6", default-features = false, features = ["avif-native", "png", "ico"] }
fast_image_resize = { version = "4", features = ["image"] }
wgpu = { version = "29.0.3", features = ["static-dxc"] }
notify-rust = "4.11.7"
rand = "0.10.0"
rodio = "0.22.2"
rusqlite = { version = "0.39.0", features = ["bundled", "fallible_uint", "serialize"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
softbuffer = "0.4.6"
tempfile = "3.21.0"
webbrowser = { version = "1.0.5", features = ["hardened"] }
winit = "0.30.12"
libc = "0.2"
ab_glyph = "0.2.32"
wallpaper = "3.2.0"
dirs = "6.0.0"
indexmap = "2.13.0"
walkdir = "2.5.0"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1"
pollster = "0.4.0"
mlua = { version = "0.11.6", features = ["lua55", "vendored", "anyhow", "serde", "userdata-wrappers"] }
egui_software_backend = { git = "https://github.com/DGriffin91/egui_software_backend.git", features = ["rayon"] }
bytemuck = { version = "1.24.0", features = ["derive"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.34.0"
rayon = "1.11.0"
tiny-skia = "0.12.0"
url = "2.5.8"
uuid = "1.18.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", features = ["MTLDevice", "MTLTexture", "MTLResource", "MTLPixelFormat"] }
objc2-io-surface = { version = "0.3.2", features = ["IOSurfaceRef", "objc2"], default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
x11-dl = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }

[features]
static-ffmpeg = ["ffmpeg-next/static"]
# Vendors and statically links FFmpeg from pristine upstream source, without
# --enable-gpl/--enable-nonfree (i.e. no libx264/libx265/etc). This keeps the
# resulting binary under FFmpeg's default LGPL v2.1+ license instead of GPL,
# which system-installed FFmpeg (Ubuntu apt, Homebrew) is normally built with.
# Used for official release builds on Linux/macOS - see .github/workflows/build.yml.
build-ffmpeg = ["ffmpeg-next/build", "ffmpeg-next/build-lib-dav1d"]

[dev-dependencies]
zstd = "0.13.3"
tokio = { version = "1.48.0", features = ["test-util"] }
