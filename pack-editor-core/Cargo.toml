[package]
name = "pack-editor-core"
version.workspace = true
description = "The Lewdware pack editor's model: packs, history and media import, with no UI"
authors = ["restoredelight <restoreddelight@proton.me>"]
edition = "2021"

[dependencies]
shared = { path = "../shared", features = ["encode"] }
converter = { path = "../converter" }
anyhow = "1"
blake3 = "1.8"
dirs = "6"
futures = "0.3"
infer = "0.22.0"
libc = "0.2"
mime_guess = "2"
r2d2 = "0.8"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
rayon = "1"
reflink-copy = "0.1"
rusqlite = { version = "0.40.1", features = ["array", "backup", "bundled", "fallible_uint", "session", "vtab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
# `examples/seed_draft.rs` encodes a small WebP thumbnail per synthetic file.
image = { version = "0.25", default-features = false, features = ["webp"] }
proptest = "1"
tracing-subscriber = "0.3"
zip = "2.2"
