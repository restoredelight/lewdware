[package]
name = "shared"
version.workspace = true
edition = "2024"

[features]
mlua = ["dep:mlua"]
ipc = ["dep:interprocess", "tokio/net", "tokio/time"]
# Media probing and encoding (`encode::file_info`, `encode_file`, ...) on the linked ffmpeg
# libraries. Only the pack editor and the converter need it.
encode = ["dep:ffmpeg-next", "dep:image"]

[dependencies]
anyhow = "1.0.100"
blake3 = "1.8"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
ciborium = "0.2.2"
dirs = "6.0.0"
ffmpeg-next = { version = "9.0.0", optional = true }
glob = "0.3.3"
# Lossless WebP for thumbnails when the linked ffmpeg was built without libwebp.
image = { version = "0.25", default-features = false, features = ["webp"], optional = true }
indexmap = { version = "2.13.0", features = ["serde"] }
interprocess = { version = "2.4.2", features = ["tokio"], optional = true }
itertools = "0.15.0"
json5 = "1.3.1"
mlua = { version = "0.12.0", optional = true }
nom-exif = "3.6"
rusqlite = { version = "0.40.1", features = ["array", "bundled", "fallible_uint"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
serde_with = "3.16.1"
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["fs", "io-std", "io-util", "rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
which = "8.0.0"
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Killing the encode worker's whole process group (`encode::worker`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
