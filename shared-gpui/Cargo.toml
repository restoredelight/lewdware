[package]
name = "shared-gpui"
version.workspace = true
description = "Design tokens, components and runtime shared by the gpui apps"
authors = ["restoredelight"]
edition = "2021"

[dependencies]
gpui-kit = "0.9.0"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
tracing = "0.1"
